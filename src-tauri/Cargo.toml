[package]
name = "advoco"
version = "0.1.0"
description = "Onboarding wizard that gives new Proto-Familiar Familiars a vivid, stable personality"
license = "GPL-3.0-only"
repository = "https://github.com/ActualBroeckchen/Advoco"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
keyring = { version = "3", features = ["windows-native"] }
thiserror = "2"
url = "2"

[profile.release]
opt-level = "s"
lto = true
strip = true
